# Network Binding
port=3153
listen-address=0.0.0.0
listen-address=::1
#Use your global IPv6 address of the host (not the ::) to avoid issues with ipv6 udp queries
listen-address=2001:0db8::1
bind-interfaces
no-resolv
strict-order


# Upstream Resolvers (e.g., Cloudflare/Google)
server=8.8.8.8
server=1.1.1.1
server=2001:4860:4860::8888
server=2606:4700:4700::1111

# Query Logging to Shared Pipe
log-queries=extra
log-facility=/var/log/dnsmasq/queries.log

# Memory Cache Size
cache-size=10000

# ==============================================================================
# SSLproxy / NDR Interception Rules (Block Encrypted Client Hello & DoH)
# ==============================================================================

# 1. Strip Type 65 (HTTPS) and Type 64 (SVCB) records from responses.
# Forces browsers to fallback to standard A/AAAA lookups without ECH params.
filter-rr=HTTPS,SVCB

# 2. Sinkhole Cloudflare ECH bootstrap domains
address=/cloudflare-ech.com/0.0.0.0
address=/cloudflare-ech.com/::

# 3. Disable Firefox & Chrome automatic DNS-over-HTTPS (DoH Canary Domain)
# Tells browsers to respect local dnsmasq filtering instead of bypassing over HTTPS.
address=/use-application-dns.net/0.0.0.0
address=/use-application-dns.net/::
