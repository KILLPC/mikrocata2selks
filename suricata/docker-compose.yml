services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - ./rules-data:/var/lib/suricata
      - ./suricata-logs:/var/log/suricata
      - /mnt/ramdisk:/var/log/suricata/eve
      - ./suricata-config:/etc/suricata
    command: -i tzsp0
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3200M
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/suricata/suricata-command.socket || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
