services:
  sslproxy:
    build: .
    container_name: sslproxy
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./sslproxy.conf:/etc/sslproxy/sslproxy.conf
      - ./cert_cache:/etc/sslproxy
      - ./gencerts:/var/log/sslproxy/cert_cache
    dns:
      - 192.168.88.1
      - 2a10:ccc3:cc30::1
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8443' || timeout 1 sh -c 'exec 3<>/dev/tcp/127.0.0.1/8443' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
