services:
  icapsuricata:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: icapsuricata
    network_mode: host

    # Suricata uses relative paths such as ./suricata.log.
    working_dir: /var/log/suricata

    volumes:
      # c-icap configuration
      - ./c-icap.conf:/etc/c-icap/c-icap.conf:ro

      # Persistent Suricata data
      - ./rules-data:/var/lib/suricata

      # Suricata logs
      - ./suricata-logs:/var/log/suricata

      # Suricata configuration
      - ./suricata-config/:/etc/suricata/

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /usr/local/var/run/suricata/suricata-command.socket || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
